<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',system-ui,sans-serif;background:#F3EFE6;color:#26302D;-webkit-font-smoothing:antialiased}

.app{max-width:460px;margin:0 auto;min-height:100vh;background:#FBF8F2;box-shadow:0 0 40px rgba(0,0,0,.07);display:flex;flex-direction:column}

.rolebar{display:flex;gap:6px;padding:10px;background:#2A5F55;position:sticky;top:0;z-index:50}
.roletab{flex:1;padding:11px;border:none;border-radius:11px;background:rgba(255,255,255,.14);color:#fff;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
.roletab.on{background:#F7F2E7;color:#2A5F55}
.roletab .n{background:#C9463A;color:#fff;border-radius:20px;font-size:12px;font-weight:900;min-width:22px;height:22px;padding:0 6px;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.roletab .n.show{display:inline-flex;animation:bump .45s}
@keyframes bump{0%{transform:scale(.4)}55%{transform:scale(1.3)}100%{transform:scale(1)}}
.roletab .n.show{display:inline-block}
.admbtn{position:relative;flex:0 0 auto;width:42px;height:42px;border:none;border-radius:11px;background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.admbtn:active{transform:scale(.92)}
.admbtn .n{position:absolute;top:-5px;left:-5px;background:#C9463A;color:#fff;border-radius:20px;font-size:11px;font-weight:900;min-width:18px;height:18px;padding:0 4px;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #2A5F55}
.admbtn .n.show{display:flex;animation:bump .45s}

.hero{background:linear-gradient(160deg,#2A5F55,#1D453D);color:#fff;padding:22px 20px 26px;text-align:center;border-radius:0 0 26px 26px}
.hero h1{font-size:23px;font-weight:900;letter-spacing:-.3px}
.hero p{font-size:12.5px;opacity:.82;margin-top:5px}

.body{padding:18px;flex:1}
.view{display:none}
.view.on{display:block;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:#fff;border:1px solid #E8DFCC;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(42,95,85,.05)}
.card h2{font-size:15px;font-weight:800;color:#2A5F55;margin-bottom:14px;display:flex;align-items:center;gap:7px}

label{display:block;font-size:12.5px;font-weight:700;color:#4A5A56;margin-bottom:7px}
input{width:100%;padding:13px 14px;border:1.6px solid #E2D9C6;border-radius:12px;background:#FEFDFA;font-family:inherit;font-size:16px;color:#26302D;outline:none;transition:.2s}
input:focus{border-color:#2A5F55;background:#fff}
input.bad{border-color:#C9463A;background:#FDF4F3}
.field{margin-bottom:15px}
.hint{font-size:11.5px;color:#C9463A;margin-top:6px;display:none}
.hint.show{display:block}

.btn{width:100%;padding:15px;border:none;border-radius:13px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:transform .12s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.975)}
.btn.green{background:#2A5F55;color:#fff;box-shadow:0 6px 16px rgba(42,95,85,.28)}
.btn.gold{background:#C08A2E;color:#fff;box-shadow:0 6px 16px rgba(192,138,46,.3)}
.btn.ok{background:#3B8C68;color:#fff;box-shadow:0 6px 16px rgba(59,140,104,.28)}
.btn.line{background:#fff;color:#2A5F55;border:1.6px solid #CFDCD8}
.btn.sm{padding:11px;font-size:13px;border-radius:11px}

.callbtn{width:100%;padding:22px 18px;border:none;border-radius:18px;background:linear-gradient(150deg,#D8503F,#B03526);color:#fff;font-family:inherit;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 10px 26px rgba(176,53,38,.4);animation:glow 1.8s ease-in-out infinite;display:flex;flex-direction:column;align-items:center;gap:5px}
.callbtn small{font-size:12px;font-weight:600;opacity:.9}
.callbtn:active{transform:scale(.97);animation:none}
@keyframes glow{0%,100%{box-shadow:0 10px 26px rgba(176,53,38,.35)}50%{box-shadow:0 10px 30px rgba(176,53,38,.55),0 0 0 8px rgba(216,80,63,.13)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

.plate{font-size:31px;font-weight:900;letter-spacing:3px;color:#2A5F55;font-family:ui-monospace,'Courier New',monospace;unicode-bidi:plaintext;text-align:center}
.platebox{background:linear-gradient(150deg,#EDF3F1,#F7F2E7);border:2px dashed #A9C2BB;border-radius:16px;padding:16px;text-align:center;margin-bottom:14px}
.platebox .lbl{font-size:11px;color:#6D7C78;margin-bottom:6px}

.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:30px;font-size:12.5px;font-weight:800;background:#EDF3F1;color:#2A5F55;border:1.5px solid #C3D6D1}
.pill.hot{background:#FCEEEC;color:#B03526;border-color:#E9B5AE}
.pill.done{background:#EAF5EF;color:#2F7A58;border-color:#B6DCC7}
.dt{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.tl{margin:16px 0 6px}
.tl .s{display:flex;gap:12px;position:relative;padding-bottom:18px}
.tl .s:last-child{padding-bottom:0}
.tl .s::before{content:"";position:absolute;right:13px;top:28px;bottom:0;width:2px;background:#E2D9C6}
.tl .s:last-child::before{display:none}
.tl .s.ok::before{background:#3B8C68}
.dot{width:28px;height:28px;border-radius:50%;background:#F1EBDD;border:2px solid #E2D9C6;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#9AA6A2;z-index:1}
.s.ok .dot{background:#3B8C68;border-color:#3B8C68;color:#fff}
.s.now .dot{background:#C08A2E;border-color:#C08A2E;color:#fff;box-shadow:0 0 0 4px rgba(192,138,46,.16)}
.s b{display:block;font-size:13.5px;color:#26302D}
.s span{display:block;font-size:11.5px;color:#8A948F;margin-top:2px}
.s.now b{color:#C08A2E}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.st{background:#fff;border:1px solid #E8DFCC;border-radius:15px;padding:14px;text-align:center}
.st b{display:block;font-size:26px;font-weight:900;color:#2A5F55;line-height:1.1}
.st span{font-size:11.5px;color:#8A948F}
.st.hot{background:#FCEEEC;border-color:#E9B5AE}
.st.hot b{color:#B03526}

.siren{background:linear-gradient(150deg,#FCEEEC,#FBE3E0);border:2px solid #D8503F;border-radius:16px;padding:15px;margin-bottom:14px;text-align:center;animation:glow2 1.8s infinite}
.siren{}
@keyframes glow2{0%,100%{box-shadow:0 0 0 0 rgba(216,80,63,.28)}50%{box-shadow:0 0 0 7px rgba(216,80,63,0)}}
.siren b{display:block;font-size:16px;color:#B03526;margin-bottom:4px}
.siren span{font-size:12.5px;color:#6B4741}

.tk{background:#fff;border:1px solid #E8DFCC;border-right:5px solid #C08A2E;border-radius:15px;padding:14px;margin-bottom:11px}
.tk.hot{border-right-color:#D8503F;background:#FFF9F8;box-shadow:0 4px 14px rgba(216,80,63,.15)}

<script>
var TICKETS = [];
var MYID = null;      /* غير مستخدَم في لوحة التحكم — يبقى لتوافق دوال المزامنة */
var GUESTBK = null;
var LASTBKID = null;
var ROLE = 's';
var KEY = 'valet_v2_indep';
var CH = null;
var DEL_B = {};
var PIN_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
var ADMINPIN_HASH = 'e0bc60c82713f64ef8a57c0c40d02ce24fd0141d5cc3086259c19b1e62a62bea';
var PIN_UPD = 0;
var ADMINPIN_UPD = 0;
function sha256Hex(str){
  var enc = new TextEncoder().encode(str);
  return crypto.subtle.digest('SHA-256', enc).then(function(buf){
    var b = new Uint8Array(buf), hex = '';
    for(var i=0;i<b.length;i++) hex += ('0'+b[i].toString(16)).slice(-2);
    return hex;
  });
}
function snapshotState(){
  return { t:TICKETS, m:MYID, gb:GUESTBK, lb:LASTBKID, ph:PIN_HASH, aph:ADMINPIN_HASH, pu:PIN_UPD, apu:ADMINPIN_UPD, n:NOTES, b:BOOKINGS, c:CFG, db:DEL_B };
}
function safeLoad(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && d.t){
        TICKETS = d.t; MYID = d.m || null; GUESTBK = d.gb || null; LASTBKID = d.lb || null;
        if(d.ph) PIN_HASH = d.ph; if(d.aph) ADMINPIN_HASH = d.aph;
        if(d.pu) PIN_UPD = d.pu; if(d.apu) ADMINPIN_UPD = d.apu;
        if(d.n) NOTES = d.n; if(d.b) BOOKINGS = d.b; if(d.c) CFG = d.c;
        if(d.db) DEL_B = d.db;
      }
    }
  }catch(e){}
}
function safeSave(){
  try{ localStorage.setItem(KEY, JSON.stringify(snapshotState())); }
  catch(e){
    try{
      var lite=[];
      for(var i=0;i<TICKETS.length;i++){
        var c={}; for(var k in TICKETS[i]) if(k!=='photo') c[k]=TICKETS[i][k];
        lite.push(c);
      }
      var snap = snapshotState(); snap.t = lite;
      localStorage.setItem(KEY, JSON.stringify(snap));
    }catch(e2){}
  }
  finally{ firePush(); }
  try{ if(CH) CH.postMessage(snapshotState()); }catch(e){}
}
try{
  CH = new BroadcastChannel('valet_v2_indep');
  CH.onmessage = function(e){
    var d = e.data;
    if(d && d.t){
      TICKETS = d.t; if(d.n) NOTES = d.n; if(d.b) BOOKINGS = d.b; if(d.c) CFG = d.c;
      if(d.ph) PIN_HASH = d.ph; if(d.aph) ADMINPIN_HASH = d.aph;
      if(d.pu) PIN_UPD = d.pu; if(d.apu) ADMINPIN_UPD = d.apu;
      if(d.db) DEL_B = d.db;
      chime('other'); paint();
    }
  };
}catch(e){}
try{ window.addEventListener('storage', function(){ safeLoad(); paint(); }); }catch(e){}
function now(){ var d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function uid(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
/* يحوّل رقم جوال سعودي محلي (05XXXXXXXX) لصيغة دولية ويبني رابط واتساب مع رسالة جاهزة */
function waLink(localPhone, text){
  var p = String(localPhone||'').replace(/\D/g,'');
  if(/^05\d{8}$/.test(p)) p = '966' + p.slice(1);
  else if(/^9665\d{8}$/.test(p)) { /* already international */ }
  else return null;
  return 'https://wa.me/'+p+(text ? '?text='+encodeURIComponent(text) : '');
}

function show(id){
  var v=document.querySelectorAll('.view');
  for(var i=0;i<v.length;i++){ v[i].classList.remove('on'); }
  document.getElementById(id).classList.add('on');
}
function toast(m,k){
  var t=document.getElementById('toast');
  t.textContent=m; t.className='toast on '+(k||'');
  clearTimeout(t._x); t._x=setTimeout(function(){ t.className='toast '+(k||''); },2600);
  beep(k);
}
function beep(k){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    var c=new C(), o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = k==='bad'?300:(k==='ok'?660:480);
    g.gain.setValueAtTime(.18,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);
    o.start(); o.stop(c.currentTime+.22);
  }catch(e){}
}
/* ===== عرض الصور (اللوحات والإيصالات) ===== */function openLb(id){
  for(var i=0;i<TICKETS.length;i++){
    if(TICKETS[i].id===id && TICKETS[i].photo){
      document.getElementById('lbimg').src = TICKETS[i].photo;
      document.getElementById('lbcap').textContent = TICKETS[i].plate;
      document.getElementById('lb').classList.add('on');
      return;
    }
  }
}
function closeLb(){ document.getElementById('lb').classList.remove('on'); }

var UNLOCKED = false;
var ADMINUNLOCKED = false;
var BUF = '';
var PINLEN = 4;
var TRIES = 0;
var LOCKED_UNTIL = 0;
var MODE = 'login';   /* login | new | confirm */
var TMP = '';
var LOCKTIMER = null;

function pinReset(){ BUF=''; MODE='login'; TMP=''; PINLEN=4; drawPin(); }
function pinLenFor(mode){ return (mode==='adminlogin'||mode==='adminnew'||mode==='adminconfirm') ? 6 : 4; }
function pinScreen(){
  var titles = {
    login:['دخول الموظف','منطقة مخصصة لموظفي الخدمة'],
    adminlogin:['رمز الإدارة','هذه الخانة خاصة بمسؤول التطبيق فقط'],
    adminnew:['رمز إداري جديد','اختر رمزاً جديداً من 6 أرقام'],
    adminconfirm:['تأكيد الرمز الإداري','أعد إدخال نفس الرمز'],
    'new':['رمز دخول جديد','اختر رمزاً جديداً من 4 أرقام'],
    confirm:['تأكيد رمز الدخول','أعد إدخال نفس الرمز']
  };
  var t = titles[MODE] || titles.login;
  PINLEN = pinLenFor(MODE);
  if(BUF.length > PINLEN) BUF = '';
  document.getElementById('heroT').textContent = t[0];
  document.getElementById('heroS').textContent = t[1];
  document.getElementById('pin-t').textContent = t[0];
  show('v-pin');
  drawPin();
}
function drawPin(){
  var dEl = document.getElementById('pin-dots');
  var html = '';
  for(var i=0;i<PINLEN;i++){ html += '<i'+(i<BUF.length?' class="f"':'')+'></i>'; }
  dEl.innerHTML = html;
  dEl.style.gap = PINLEN>4 ? '10px' : '13px';
  var t={login:'رمز دخول الموظف',neu:'الرمز الجديد',confirm:'تأكيد الرمز'};
  var icons = { login:'🔒', adminlogin:'🛡️', 'new':'🔑', confirm:'🔑', adminnew:'🛡️', adminconfirm:'🛡️' };
  var subs  = { login:'أدخل الرمز المكوّن من 4 أرقام', adminlogin:'أدخل الرمز الإداري من 6 أرقام', 'new':'من 4 أرقام', confirm:'للتأكيد', adminnew:'من 6 أرقام', adminconfirm:'للتأكيد' };
  document.getElementById('pin-ic').textContent = icons[MODE] || '🔒';
  document.getElementById('pin-s').textContent = subs[MODE] || 'أدخل الرمز المكوّن من 4 أرقام';
  var wait = Math.ceil((LOCKED_UNTIL - Date.now())/1000);
  var pad = document.getElementById('pin-pad').querySelectorAll('button');
  for(var k=0;k<pad.length;k++){ pad[k].disabled = wait>0; }
}
function pinMsg(m, bad){
  document.getElementById('pin-msg').textContent = m || '';
  var dots = document.getElementById('pin-dots');
  if(bad){ dots.className='dots err'; setTimeout(function(){ dots.className='dots'; drawPin(); },430); }
}
function pinKey(n){
  if(Date.now() < LOCKED_UNTIL) return;
  if(BUF.length>=PINLEN) return;
  BUF += n; drawPin();
  document.getElementById('pin-msg').textContent='';
  if(BUF.length===PINLEN) setTimeout(pinSubmit,170);
}
function pinDel(){ if(Date.now()<LOCKED_UNTIL) return; BUF=BUF.slice(0,-1); drawPin(); }

function pinCancel(){
  if(MODE==='login'){ BUF=''; drawPin(); }
  else if(MODE==='adminlogin' || MODE==='adminnew' || MODE==='adminconfirm'){
    MODE='login'; BUF=''; TMP=''; paint();
  }
  else { MODE='login'; BUF=''; TMP=''; UNLOCKED=true; paint(); }
}
function pinSubmit(){
  if(MODE==='adminlogin'){
    sha256Hex(BUF).then(function(h){
      if(h===ADMINPIN_HASH){
        ADMINUNLOCKED=true; TRIES=0; BUF=''; pinMsg('');
        toast('تم فتح إعدادات الإدارة','ok');
        if(PENDING_ADMIN_CHANGE){ PENDING_ADMIN_CHANGE=false; MODE='adminnew'; BUF=''; pinScreen(); }
        else { MODE='login'; openSettings(); }
      }else{
        TRIES++; BUF='';
        pinMsg('الرمز الإداري غير صحيح — بقي لك '+(5-TRIES)+' محاولات', true);
        beep('bad');
        if(TRIES>=5){
          LOCKED_UNTIL = Date.now()+30000; TRIES=0; drawPin();
          pinMsg('محاولات كثيرة — انتظر 30 ثانية', true);
          clearInterval(LOCKTIMER);
          LOCKTIMER = setInterval(function(){
            var w = Math.ceil((LOCKED_UNTIL-Date.now())/1000);
            if(w<=0){ clearInterval(LOCKTIMER); pinMsg(''); drawPin(); }
            else document.getElementById('pin-msg').textContent='محاولات كثيرة — انتظر '+w+' ثانية';
          },1000);
        }
      }
    });
    return;
  }
  if(MODE==='adminnew'){ TMP=BUF; BUF=''; MODE='adminconfirm'; pinMsg(''); pinScreen(); return; }
  if(MODE==='adminconfirm'){
    if(BUF===TMP){
      sha256Hex(TMP).then(function(h){
        ADMINPIN_HASH=h; ADMINPIN_UPD=Date.now(); TMP=''; BUF=''; MODE='login';
        safeSave();
        toast('تم تغيير الرمز الإداري بنجاح','ok');
        paint();
      });
    }else{
      BUF=''; MODE='adminnew';
      pinMsg('الرمزان غير متطابقين — أعد المحاولة', true);
      beep('bad');
    }
    return;
  }
  if(MODE==='login'){
    sha256Hex(BUF).then(function(h){
      if(h===PIN_HASH){
        UNLOCKED=true; TRIES=0; BUF=''; pinMsg('');
        toast('أهلاً بك، تم فتح لوحة الموظف','ok');
        paint();
      }else{
        TRIES++; BUF='';
        if(TRIES>=5){
          LOCKED_UNTIL = Date.now()+30000;
          TRIES=0;
          drawPin();
          pinMsg('محاولات كثيرة — انتظر 30 ثانية', true);
          beep('bad');
          clearInterval(LOCKTIMER);
          LOCKTIMER = setInterval(function(){
            var w = Math.ceil((LOCKED_UNTIL-Date.now())/1000);
            if(w<=0){ clearInterval(LOCKTIMER); pinMsg(''); drawPin(); }
            else document.getElementById('pin-msg').textContent='محاولات كثيرة — انتظر '+w+' ثانية';
          },1000);
        }else{
          pinMsg('الرمز غير صحيح — بقي لك '+(5-TRIES)+' محاولات', true);
          beep('bad');
        }
      }
    });
  }else if(MODE==='new'){
    TMP=BUF; BUF=''; MODE='confirm'; pinMsg(''); pinScreen();
  }else{
    if(BUF===TMP){
      sha256Hex(TMP).then(function(h){
        PIN_HASH=h; PIN_UPD=Date.now(); TMP=''; BUF=''; MODE='login'; UNLOCKED=true;
        safeSave();
        toast('تم تغيير رمز الدخول بنجاح','ok');
        paint();
      });
    }else{
      BUF=''; MODE='new'; TMP='';
      pinMsg('الرمزان غير متطابقين — أعد المحاولة', true);
      beep('bad');
    }
  }
}
function lockStaff(){ UNLOCKED=false; ADMINUNLOCKED=false; SETTINGS_OPEN=false; BUF=''; MODE='login'; TRIES=0; toast('تم قفل لوحة الموظف'); paint(); }
function startChangePin(){ MODE='new'; BUF=''; TMP=''; pinMsg(''); pinScreen(); }
function startChangeAdminPin(){
  if(!ADMINUNLOCKED){ MODE='adminlogin'; BUF=''; pinScreen(); PENDING_ADMIN_CHANGE=true; return; }
  MODE='adminnew'; BUF=''; TMP=''; pinMsg(''); pinScreen();
}
var PENDING_ADMIN_CHANGE = false;
/* ===== نظام التنبيهات ===== *//* ================= نظام التنبيهات ================= */
var NOTES = [];      /* {id,to,ic,tx,t,read} */
var OPENBOX = {g:false, s:false};
function pushNote(to, ic, tx, tid, rep){
  NOTES.unshift({ id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                  to:to, ic:ic, tx:tx, tid:tid||null, t:now(), at:Date.now(), read:false, _from:SESSION_ID, rep:!!rep });
  if(NOTES.length>40) NOTES.length=40;
  safeSave();
  chime(to === ROLE ? 'self' : 'other');
  buzz(to==='s' ? [90,70,90] : [140]);
  if(to === ROLE) toast(ic+'  '+tx, 'ok');
  paint();
}
function unread(to){ var c=0; for(var i=0;i<NOTES.length;i++){ if(NOTES[i].to===to && !NOTES[i].read) c++; } return c; }
function markRead(to){
  var ch=false;
  for(var i=0;i<NOTES.length;i++){ if(NOTES[i].to===to && !NOTES[i].read){ NOTES[i].read=true; ch=true; } }
  if(ch){ safeSave(); paint(); }
}
function toggleBox(to){ OPENBOX[to]=!OPENBOX[to]; if(OPENBOX[to]) markRead(to); else paint(); }
function drawInbox(to, elId){
  var el=document.getElementById(elId); if(!el) return;
  var list=[], u=unread(to);
  for(var i=0;i<NOTES.length;i++){ if(NOTES[i].to===to) list.push(NOTES[i]); }
  var rows='';
  if(!list.length){ rows='<div class="nempty">لا توجد إشعارات بعد</div>'; }
  else{
    for(var j=0;j<list.length;j++){
      var n=list[j];
      rows+='<div class="nt'+(n.read?'':' new')+'">'+(n.read?'':'<i class="nd"></i>')+
            '<span class="ic">'+n.ic+'</span><div class="tx"><b>'+esc(n.tx)+'</b><span>'+n.t+'</span></div></div>';
    }
  }
  el.innerHTML='<div class="inbox'+(OPENBOX[to]?' open':'')+'">'+
    '<div class="hd" onclick="toggleBox(\''+to+'\')"><b>🔔 الإشعارات <span class="c'+(u?' show':'')+'">'+u+'</span></b>'+
    '<span class="ar">'+(OPENBOX[to]?'▲ إخفاء':'▼ عرض')+'</span></div>'+
    '<div class="ls">'+rows+'</div></div>';
}
/* ===== الصوت ===== *//* ================= الصوت ================= */
var AC = null, AUDIO_OK = false;
function acGet(){
  try{
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    if(!AC){
      /* يسمح بتشغيل الصوت رغم مفتاح الصامت على iOS 16.4+ */
      try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
      AC = new C();
    }
    return AC;
  }catch(e){ return null; }
}
/* فتح قفل الصوت: تشغيل مقطع صامت أثناء لمسة المستخدم — الطريقة الوحيدة الموثوقة على iOS */
function unlockAudio(){
  var c = acGet(); if(!c) return;
  try{
    var b = c.createBuffer(1, 1, 22050);
    var src = c.createBufferSource();
    src.buffer = b; src.connect(c.destination);
    src.start(0);
  }catch(e){}
  if(c.state === 'suspended'){
    try{ c.resume().then(function(){ AUDIO_OK = (c.state==='running'); drawSoundBtn(); }); }catch(e){}
  }else{
    AUDIO_OK = true;
  }
  setTimeout(function(){ AUDIO_OK = (c.state==='running'); drawSoundBtn(); }, 260);
}
document.addEventListener('touchstart', unlockAudio, {passive:true});
document.addEventListener('click', unlockAudio);
function playSeq(seq){
  var c = acGet(); if(!c) return;
  for(var i=0;i<seq.length;i++){
    (function(f,i){
      try{
        var o=c.createOscillator(), g=c.createGain();
        o.type='sine'; o.connect(g); g.connect(c.destination);
        o.frequency.value=f;
        var t0=c.currentTime + i*0.14;
        g.gain.setValueAtTime(0.0001,t0);
        g.gain.exponentialRampToValueAtTime(0.45,t0+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+0.34);
        o.start(t0); o.stop(t0+0.36);
      }catch(e){}
    })(seq[i],i);
  }
}
function chime(kind){
  var c = acGet(); if(!c) return;
  var seq = (kind==='big')   ? [988,1319,988,1319,988,1319]
          : (kind==='other') ? [784,988,1319,988]
          : [659,880];
  if(c.state === 'suspended'){
    try{ c.resume().then(function(){
      if(c.state==='running'){ playSeq(seq); AUDIO_OK=true; }
      else{ AUDIO_OK=false; }
      drawSoundBtn();
    }); }
    catch(e){ AUDIO_OK=false; drawSoundBtn(); }
    setTimeout(function(){
      if(c.state==='running'){ playSeq(seq); AUDIO_OK=true; }
      else{ AUDIO_OK=false; }
      drawSoundBtn();
    }, 120);
  }else{
    playSeq(seq);
    AUDIO_OK = true;
  }
}
function buzz(pat){ try{ if(navigator.vibrate) navigator.vibrate(pat); }catch(e){} }
/* بعض المتصفحات (خاصة أجهزة الكمبيوتر) تُعلّق محرك الصوت تلقائياً بعد فترة خمول
   حتى لو فُعّل سابقاً بنجاح — نراقب حالته باستمرار بدل الوثوق بأنه سيبقى مفعّلاً للأبد */
setInterval(function(){
  if(AC && AUDIO_OK && AC.state!=='running'){ AUDIO_OK=false; drawSoundBtn(); }
  else if(AC && !AUDIO_OK && AC.state==='running'){ AUDIO_OK=true; drawSoundBtn(); }
}, 3000);
var BIGT = null;
function bigAlert(ic, title, sub, hot, repeat){
  var el = document.getElementById('bigalert'); if(!el) return;
  document.getElementById('ba-ic').textContent = ic;
  document.getElementById('ba-t').textContent = title;
  document.getElementById('ba-s').textContent = sub;
  el.className = 'bigalert on' + (hot ? ' hot' : '');
  chime('big'); buzz([200,90,200,90,300]);
  clearInterval(BIGT); clearTimeout(window._bigAuto);
  /* تنبيهات الإجراءات المطلوبة (تسجيل/استلام/إحضار/تسليم) تتكرر كل 5 ثوانٍ
     حتى يضغط المستخدم "تمام، فهمت" — الرسائل الإعلامية البحتة تُنبَّه مرة واحدة فقط */
  if(repeat){
    BIGT = setInterval(function(){
      if(el.classList.contains('on')){ chime('big'); buzz([200,90,200]); }
      else clearInterval(BIGT);
    }, 5000);
  }
}
function closeBig(){
  clearInterval(BIGT); clearTimeout(window._bigAuto);
  var el = document.getElementById('bigalert');
  if(el) el.className = 'bigalert';
}
/* زر تفعيل/اختبار الصوت */
function drawSoundBtn(){
  var els = document.querySelectorAll('.sndbtn');
  for(var i=0;i<els.length;i++){
    els[i].innerHTML = AUDIO_OK ? '🔔 اختبار صوت التنبيه' : '🔕 اضغط لتفعيل صوت التنبيهات';
    els[i].className = 'sndbtn shoot' + (AUDIO_OK ? ' again' : '');
  }
  var w = document.querySelectorAll('.sndwarn');
  for(var j=0;j<w.length;j++){
    w[j].style.display = AUDIO_OK ? 'none' : 'block';
    w[j].innerHTML = AC
      ? 'الصوت متوقف الآن — <b>اضغط الزر أعلاه</b> لإعادة تفعيله. المتصفح يوقفه أحياناً بعد فترة خمول. التنبيه البصري والاهتزاز يعملان دائماً.'
      : 'إن لم تسمع صوتاً: أوقف <b>مفتاح الصامت</b> بجانب الآيفون وارفع مستوى الصوت. التنبيه البصري والاهتزاز يعملان في كل الأحوال.';
  }
}
function testSound(){
  unlockAudio();
  setTimeout(function(){
    bigAlert('🔔','هذا شكل التنبيه','هكذا سيصلك الإشعار عند الاستلام والتسليم — بصوت واهتزاز ورسالة واضحة.', false);
  }, 220);
}

function inAppBrowser(){
  var u=navigator.userAgent||'';
  return /FBAN|FBAV|Instagram|Line\/|Twitter|WhatsApp|Snapchat|TikTok|MicroMessenger/i.test(u);
}
function drawBanner(){
  var el=document.getElementById('ibBanner'); if(!el) return;
  if(!inAppBrowser()){ el.innerHTML=''; return; }
  el.innerHTML='<div class="ibb"><b>⚠️ افتح الرابط في متصفح الجوال</b>'+
    'أنت تتصفح داخل تطبيق آخر، وقد يمنع ذلك التصوير والإشعارات. اضغط ⋮ ثم «فتح في المتصفح».'+
    '<button onclick="copyLink()">📋 نسخ الرابط</button></div>';
}
function copyLink(){
  var u=location.href;
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(u); toast('تم نسخ الرابط، الصقه في Safari أو Chrome','ok'); return; }
  }catch(e){}
  try{
    var ta=document.createElement('textarea'); ta.value=u; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    toast('تم نسخ الرابط','ok');

/* ===== رموز دخول الضيوف وإدارة الحجوزات ===== */var CODE_CHARS = 'ACDEFGHJKLMNPQRTUVWXY34679';  /* بدون أحرف/أرقام متشابهة */

function genCode(){
  var c;
  do{
    c = '';
    for(var i=0;i<6;i++) c += CODE_CHARS.charAt(Math.floor(Math.random()*CODE_CHARS.length));
  } while(bkByCode(c));
  return c;
}
function bkByCode(code){
  if(!code) return null;
  var c = String(code).toUpperCase().trim();
  for(var i=0;i<BOOKINGS.length;i++){
    if(BOOKINGS[i].code && BOOKINGS[i].code === c) return BOOKINGS[i];
  }
  return null;
}
function bkById(id){
  if(!id) return null;
  for(var i=0;i<BOOKINGS.length;i++){ if(BOOKINGS[i].id===id) return BOOKINGS[i]; }
  return null;
}
/* عدد السيارات المسجّلة فعلياً تحت هذا الحجز — عدّاد على الحجز نفسه */
function bkUsed(bkid){
  var b = bkById(bkid);
  return b ? (b.used||0) : 0;
}
function bkFull(b){
  if(!b) return true;
  return bkUsed(b.id) >= (b.cars||0);
}
function bkAct(id, to){

function mergeRecords(localArr, remoteArr, localDel, remoteDel){
  var delMap = {}, k;
  for(k in remoteDel){ delMap[k] = remoteDel[k]; }
  for(k in localDel){ if(!(k in delMap) || localDel[k] > delMap[k]) delMap[k] = localDel[k]; }
  var map = {}, order = [];
  function upsert(item){
    if(delMap[item.id] !== undefined && delMap[item.id] >= (item._upd||0)) return;
    if(!(item.id in map)) order.push(item.id);
    var cur = map[item.id];
    if(!cur || (item._upd||0) >= (cur._upd||0)) map[item.id] = item;
  }
  for(var i=0;i<remoteArr.length;i++) upsert(remoteArr[i]);
  for(var j=0;j<localArr.length;j++) upsert(localArr[j]);
  var out = [];
  for(var o=0;o<order.length;o++) if(map[order[o]]) out.push(map[order[o]]);
  return { list: out, del: delMap };
}
function mergeNotes(localArr, remoteArr){
  var map = {}, order = [];
  function upsert(n){
    if(!(n.id in map)){ map[n.id] = n; order.push(n.id); }
    else{ map[n.id].read = map[n.id].read || n.read; }
  }
  for(var i=0;i<remoteArr.length;i++) upsert(remoteArr[i]);
  for(var j=0;j<localArr.length;j++) upsert(localArr[j]);
  var out = [];
  for(var o=0;o<order.length;o++) out.push(map[order[o]]);
  out.sort(function(a,b){ return (b.at||0) - (a.at||0); });
  if(out.length>60) out.length=60;
  return out;
}
function fireListen(){
  if(!FREF) return;
  FREF.onSnapshot(function(snap){
    FIRE_ONLINE = true;
    FIRE_LAST_RECV = Date.now();
    drawSyncBadge(); drawDiag();
    var d = snap.data();
    if(!d) return;
    APPLYING_REMOTE = true;
    var oldIds = {};
    for(var oi=0;oi<NOTES.length;oi++){ oldIds[NOTES[oi].id] = true; }
    if(d.n) NOTES = d.n;
    if(d.b) BOOKINGS = d.b;
    if(d.c) CFG = d.c;
    if(d.ph) PIN_HASH = d.ph;
    if(d.aph) ADMINPIN_HASH = d.aph;
    if(d.pu) PIN_UPD = d.pu;
    if(d.apu) ADMINPIN_UPD = d.apu;
    if(d.db) DEL_B = d.db;
    try{ localStorage.setItem(KEY, JSON.stringify(snapshotState())); }catch(e){}
    paint();
    if(d.n){
      var freshest = null;
      for(var ni=0;ni<d.n.length;ni++){
        var nn = d.n[ni];
        if(nn.to===ROLE && nn._from!==SESSION_ID && !oldIds[nn.id]){ freshest = nn; break; }
      }
      if(freshest) bigAlert(freshest.ic, freshest.tx, '', freshest.ic==='🚨', !!freshest.rep);
    }
    APPLYING_REMOTE = false;
  }, function(err){
    FIRE_ONLINE = false;
    FIRE_LAST_ERR = 'قراءة: ' + (err && err.message ? err.message : String(err));
    drawSyncBadge(); drawDiag();
    console.error('Firestore onSnapshot error:', err);
  });
}
function firePush(){
  if(!FIRE_READY || !FREF || APPLYING_REMOTE) return;
  var localSnap = { b:BOOKINGS, n:NOTES, c:CFG, ph:PIN_HASH, aph:ADMINPIN_HASH, pu:PIN_UPD, apu:ADMINPIN_UPD, db:DEL_B };
  FDB.runTransaction(function(tx){
    return tx.get(FREF).then(function(snap){
      var remote = snap.exists ? snap.data() : {};
      var mb = mergeRecords(localSnap.b, remote.b||[], localSnap.db||{}, remote.db||{});
      var mn = mergeNotes(localSnap.n, remote.n||[]);
      var mc = ((remote.c && remote.c._upd)||0) > ((localSnap.c && localSnap.c._upd)||0) ? remote.c : localSnap.c;
      var mph = (remote.pu||0) > (localSnap.pu||0) ? remote.ph : localSnap.ph;
      var mpu = Math.max(remote.pu||0, localSnap.pu||0);
      var maph = (remote.apu||0) > (localSnap.apu||0) ? remote.aph : localSnap.aph;
      var mapu = Math.max(remote.apu||0, localSnap.apu||0);
      var payload = { b:mb.list, n:mn, c:mc, ph:mph, aph:maph, pu:mpu, apu:mapu, db:mb.del, _at:Date.now() };
      tx.set(FREF, payload);
      return payload;
    });
  }).then(function(payload){
    APPLYING_REMOTE = true;
    BOOKINGS = payload.b; NOTES = payload.n; CFG = payload.c;
    PIN_HASH = payload.ph; ADMINPIN_HASH = payload.aph; PIN_UPD = payload.pu; ADMINPIN_UPD = payload.apu;
    DEL_B = payload.db;
    try{ localStorage.setItem(KEY, JSON.stringify(snapshotState())); }catch(e){}
    APPLYING_REMOTE = false;
    FIRE_LAST_WRITE_OK = Date.now();
    FIRE_LAST_ERR = '';
    drawDiag(); paint();
  }).catch(function(err){
    console.error('Firestore write error:', err);
    try{
      var liteB = BOOKINGS.map(function(x){ var c={}; for(var k in x) if(k!=='receipt') c[k]=x[k]; return c; });
      var lite = { b:liteB, n:NOTES, c:CFG, ph:PIN_HASH, aph:ADMINPIN_HASH, pu:PIN_UPD, apu:ADMINPIN_UPD, db:DEL_B, _at:Date.now() };
      FREF.set(lite)
        .then(function(){ FIRE_LAST_WRITE_OK = Date.now(); FIRE_LAST_ERR = 'كُتبت بدون صور (تجاوز الحجم)'; drawDiag(); })
        .catch(function(err2){
          FIRE_LAST_ERR = 'كتابة: ' + (err2 && err2.message ? err2.message : String(err2));
          console.error('Firestore write retry error:', err2);
          drawDiag();
          toast('⚠️ فشل حفظ التحديث على السيرفر — راجع لوحة التشخيص', 'bad');
        });
    }catch(e2){
      FIRE_LAST_ERR = 'كتابة: ' + (err && err.message ? err.message : String(err));
      drawDiag();
      toast('⚠️ فشل حفظ التحديث على السيرفر — راجع لوحة التشخيص', 'bad');
    }
  });
}

    if(!FIRE_READY){ els[i].style.display='none'; els[i].className='syncbadge'; continue; }
    els[i].style.display='';
    els[i].className = 'syncbadge' + (FIRE_ONLINE ? ' on' : ' off');
    els[i].innerHTML = FIRE_ONLINE ? '🟢 متصل بين الأجهزة' : '🟡 وضع محلي — لا اتصال';
  }
}
/* ===== لوحة الموظف ===== */function act(id,to){
  for(var i=0;i<TICKETS.length;i++){
    if(TICKETS[i].id===id){
      TICKETS[i].status=to; TICKETS[i].log.push({s:to,t:now()}); TICKETS[i]._upd = Date.now();
      if(to==='done') TICKETS[i].doneAt = Date.now();
      persistTicket(TICKETS[i]);
      var pl = TICKETS[i].plate;
      if(to==='parked'){
        pushNote('g','🅿️','تم استلام سيارتك '+pl+' وركنها بأمان. عند استعدادك للمغادرة اضغط زر «أتجهّز للمغادرة»', id, true);
        bigAlert('🅿️','تم استلام سيارتك '+pl,'رُكنت سيارتك بأمان. قبل مغادرتك بعشر دقائق اضغط زر «أتجهّز للمغادرة».', false, true);
        pushNote('s','🅿️','تم ركن السيارة '+pl, id);
      }
      if(to==='ready'){
        pushNote('g','🚙','سيارتك '+pl+' أصبحت أمام الباب — تفضّل بالمغادرة', id, true);
        bigAlert('🚙','سيارتك أمام الباب','اللوحة '+pl+' — تفضّل بالتوجه إلى باب الخروج.', false, true);
        pushNote('s','🚙','أُبلغ الزائر أن السيارة '+pl+' أمام الباب', id);
      }
      if(to==='done'){
        pushNote('g','🌿','تم تسليم سيارتك '+pl+' — شكراً لزيارتك، في أمان الله', id);
        bigAlert('🌿','تم تسليم سيارتك '+pl,'شكراً لزيارتك، في أمان الله. ستُمسح بياناتك من هذا الجهاز خلال ثوانٍ.', false);
        pushNote('s','✅','تم تسليم السيارة '+pl+' وانتهت الخدمة', id);
        /* الخدمة انتهت — امسح كل إشعارات هذه التذكرة (للزائر والموظف معاً) من الصندوق المشترك */
        var kept=[];
        for(var ni=0;ni<NOTES.length;ni++){ if(NOTES[ni].tid!==id) kept.push(NOTES[ni]); }
        NOTES = kept;
        safeSave();
      }
      return;
    }
  }
}
function confirmDelivery(id){
  var t = null;
  for(var i=0;i<TICKETS.length;i++){ if(TICKETS[i].id===id){ t=TICKETS[i]; break; } }
  if(!t) return;
  var code = prompt('اطلب رمز التسليم من الزائر (4 أرقام تظهر على شاشته) وأدخله هنا للتأكد من هويته قبل تسليم السيارة:');
  if(code === null) return;
  if(String(code).trim() !== String(t.pcode||'')){
    toast('❌ الرمز غير صحيح — لم يتم تسليم السيارة، تأكد من هوية الشخص','bad');
    beep('bad');
    return;
  }
  act(id,'done');
}
function paintStaff(){
  show('v-staff');
  document.getElementById('heroT').textContent='لوحة الموظف';
  document.getElementById('heroS').textContent='طلبات صف السيارات';

  var live=[], urg=[];
  for(var i=0;i<TICKETS.length;i++){
    if(TICKETS[i].status!=='done') live.push(TICKETS[i]);
    if(TICKETS[i].status==='requested') urg.push(TICKETS[i]);
  }
  document.getElementById('s-act').textContent=live.length;
  document.getElementById('s-urg').textContent=urg.length;
  document.getElementById('s-siren').innerHTML = urg.length
    ? '<div class="siren"><b>🔔 '+urg.length+' زائر يستعد للمغادرة</b><span>أحضر السيارات المطلوبة أدناه</span></div>' : '';

  if(!live.length){
    document.getElementById('s-list').innerHTML='<div class="empty"><div class="ic">🅿️</div><p>لا توجد سيارات حالياً</p></div>';
    return;
  }
  live.sort(function(a,b){
    var r={requested:0,waiting:1,ready:2,parked:3};
    if(r[a.status]!==r[b.status]) return r[a.status]-r[b.status];
    return b.at-a.at;
  });

  var h='';
  for(var k=0;k<live.length;k++){
    var t=live[k], hot=(t.status==='requested');
    var cls='tk '+(hot?'hot':t.status);
    var pill = hot?'<span class="pill hot"><i class="dt"></i>طلب إحضار</span>'
            : t.status==='waiting'?'<span class="pill">بانتظار الاستلام</span>'
            : t.status==='ready'?'<span class="pill done">أمام الباب</span>'
            : '<span class="pill">مركونة</span>';
    var msg = hot ? '<div class="msg">🚨 الزائر صاحب اللوحة «'+esc(t.plate)+'» يستعد للمغادرة — الرجاء إحضار السيارة الآن.</div>' : '';
    var btn = t.status==='waiting' ? '<button class="btn green sm" onclick="act(\''+t.id+'\',\'parked\')">استلمت السيارة وركنتها</button>'
            : t.status==='parked' ? '<button class="btn line sm" disabled style="opacity:.6">بانتظار طلب الزائر</button>'
            : t.status==='requested' ? '<button class="btn gold sm" onclick="act(\''+t.id+'\',\'ready\')">أحضرتها أمام الباب</button>'
            : '<button class="btn ok sm" onclick="confirmDelivery(\''+t.id+'\')">سلّمت السيارة للزائر</button>';
    var pic = t.photo ? '<div class="tkimg" onclick="openLb(\''+t.id+'\')"><img src="'+t.photo+'" alt="لوحة '+esc(t.plate)+'"><span class="zi">🔍 اضغط للتكبير</span></div>' : '';
    h+='<div class="'+cls+'"><div class="top"><div class="pl">'+esc(t.plate)+'</div><div class="tm">'+
       (t.log[0]?t.log[0].t:'')+'</div></div><div class="ph">📱 '+esc(t.phone)+'</div>'+pic+pill+msg+
       '<div class="acts">'+btn+'</div></div>';
  }
  document.getElementById('s-list').innerHTML=h;
}
/* تنظيف أي طلبات مُسلَّمة قديمة عند الفتح */
function purgeOld(){
  if(!TICKETS_COL) return;
  var cut=Date.now()-120000;
  for(var i=0;i<TICKETS.length;i++){
    var t=TICKETS[i];
    if(t.status==='done' && t.doneAt && t.doneAt < cut){
      TICKETS_COL.doc(t.id).delete().catch(function(){});
    }
  }
}
function purgeOldBookings(){
  var keep=[], cut=Date.now()-30*24*3600000, changed=false;
  for(var i=0;i<BOOKINGS.length;i++){
    var b=BOOKINGS[i];
    if(b.status==='done' && b.at && b.at<cut){ DEL_B[b.id]=Date.now(); changed=true; continue; }
    keep.push(b);
  }
  if(changed){ BOOKINGS=keep; safeSave(); }
}

function paint(){
  drawBanner();
  drawInstall();
  drawSoundBtn();
  var us=unread('s');
  var n=document.getElementById('tabn');
  if(n){ n.textContent=us; n.className='n'+(us?' show':''); }
  drawInbox('s','inbox-s');
  var abd = document.getElementById('admn-badge');
  if(abd){
    var pend=0; for(var pi=0;pi<BOOKINGS.length;pi++){ if(BOOKINGS[pi].status==='pending') pend++; }
    abd.textContent = pend; abd.className = 'n' + (pend ? ' show' : '');
  }
  if(MODE==='adminlogin' || MODE==='adminnew' || MODE==='adminconfirm'){ pinScreen(); }
  else if(SETTINGS_OPEN){ show('v-settings'); drawBooks(); }
  else if(!UNLOCKED || MODE==='new' || MODE==='confirm'){ pinScreen(); }
  else paintStaff();
}

safeLoad();
purgeOldBookings();
paint();
fireInit();
</script>
